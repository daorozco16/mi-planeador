<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi mejor versión — un día a la vez</title>
<style>
  :root{
    --paper: #EAE3D2;
    --paper-deep: #DFD6BF;
    --card: #F4EFE2;
    --card-line: #CBC0A3;
    --ink: #2B2621;
    --ink-soft: #6E6250;
    --ink-faint: #9A8E78;
    --teal: #2F5D55;
    --teal-soft: #DCE7E1;
    --ochre: #A9741F;
    --ochre-soft: #F1E3C4;
    --blue: #46647C;
    --blue-soft: #DDE6EC;
    --clay: #9C5340;
    --clay-soft: #EFDAD2;
    --radius-card: 3px;
    --radius-pill: 999px;
    --stack-gap: 20px;
    --shadow-card: 0 1px 0 rgba(43,38,33,0.06), 0 8px 18px -14px rgba(43,38,33,0.35);
    --font-display: "Iowan Old Style","Palatino Linotype","Book Antiqua", Georgia, "Times New Roman", serif;
    --font-body: "Avenir Next","Century Gothic","Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.35), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    padding:28px 16px 80px;
  }

  .wrap{max-width:1080px;margin:0 auto;}

  a,button,input,textarea{font-family:inherit;color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}

  /* ---------- Header ---------- */
  .top-row{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:16px;flex-wrap:wrap;margin-bottom:18px;
  }

  .brand{display:flex;flex-direction:column;gap:1px;}
  .brand-mark{
    font-family:var(--font-display);font-style:italic;font-size:20px;
    color:var(--ink);
  }
  .brand-sub{
    font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);
  }

  .util-btns{display:flex;gap:8px;}
  .icon-btn{
    display:flex;align-items:center;gap:6px;
    background:transparent;border:1px solid var(--card-line);
    border-radius:var(--radius-pill);padding:7px 12px;
    font-size:12.5px;color:var(--ink-soft);
    transition:background .15s, color .15s, border-color .15s;
  }
  .icon-btn:hover{background:var(--card);border-color:var(--ink-faint);color:var(--ink);}
  .icon-btn svg{width:14px;height:14px;flex:none;}

  header.hero{
    display:grid;grid-template-columns: 1fr auto;gap:22px;align-items:end;
    padding-bottom:16px;border-bottom:2px solid var(--ink);
    margin-bottom:var(--stack-gap);
  }

  .date-nav{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .nav-arrow{
    background:none;border:1px solid var(--card-line);border-radius:var(--radius-pill);
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  }
  .nav-arrow:hover{background:var(--card);}
  .nav-arrow svg{width:14px;height:14px;}
  .today-pill{
    background:none;border:1px dashed var(--ink-faint);border-radius:var(--radius-pill);
    padding:4px 12px;font-size:12px;color:var(--ink-soft);
  }
  .today-pill:hover{background:var(--card);}

  .date-big{font-family:var(--font-display);font-weight:400;line-height:.95;}
  .date-big .dow{
    display:block;font-size:15px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--clay);margin-bottom:6px;font-family:var(--font-body);font-weight:600;
  }
  .date-big .num{font-size:clamp(48px,8vw,74px);}
  .date-big .rest{font-size:17px;color:var(--ink-soft);margin-left:8px;}

  .weather-block{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .weather-label{font-size:11.5px;letter-spacing:.1em;color:var(--ink-faint);}
  .weather-picker{display:flex;gap:6px;}
  .weather-btn{
    width:42px;height:42px;border-radius:50%;border:1.5px solid var(--card-line);
    background:var(--card);display:flex;align-items:center;justify-content:center;
    transition:transform .15s, border-color .15s, background .15s, color .15s;
    color:var(--ink-soft);
  }
  .weather-btn svg{width:20px;height:20px;}
  .weather-btn:hover{transform:translateY(-2px);}
  .weather-btn[data-active="true"][data-w="sol"]{background:var(--ochre-soft);border-color:var(--ochre);color:var(--ochre);}
  .weather-btn[data-active="true"][data-w="nube"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);}
  .weather-btn[data-active="true"][data-w="lluvia"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);}

  .progress-note{font-size:11.5px;color:var(--ink-faint);margin-top:2px;text-align:right;}

  /* ---------- Aviso de respaldo ---------- */
  .backup-banner{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--ochre-soft);border:1px solid var(--ochre);border-radius:var(--radius-card);
    padding:10px 14px;margin-bottom:var(--stack-gap);font-size:12.5px;color:var(--ink);
  }
  .backup-icon{flex:none;color:var(--ochre);display:flex;}
  .backup-icon svg{width:16px;height:16px;}
  .backup-banner .msg{flex:1;min-width:200px;}
  .backup-banner .export-now{
    flex:none;background:var(--ink);color:var(--paper);border:none;border-radius:var(--radius-pill);
    padding:7px 13px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;
  }
  .backup-banner .export-now svg{width:12px;height:12px;}
  .backup-banner .export-now:hover{background:var(--teal);}
  .backup-banner .dismiss{
    flex:none;background:none;border:none;color:var(--ink-soft);width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
  }
  .backup-banner .dismiss svg{width:12px;height:12px;}
  .backup-banner .dismiss:hover{color:var(--ink);}

  /* ---------- Quote ribbon ---------- */
  .quote-ribbon{
    background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius-card);
    padding:16px 18px 12px;margin-bottom:var(--stack-gap);box-shadow:var(--shadow-card);
  }
  .quote-ribbon.grat-ribbon .quote-mark{color:var(--teal);}
  .quote-top{display:flex;align-items:flex-start;gap:14px;}
  .quote-mark{flex:none;color:var(--clay);margin-top:2px;}
  .quote-mark svg{width:24px;height:24px;}
  .quote-input{
    flex:1;width:100%;border:none;background:transparent;font-family:var(--font-display);
    font-size:17px;font-style:italic;color:var(--ink);min-width:0;
    line-height:1.45;resize:none;overflow:hidden;padding:0;display:block;
    white-space:pre-wrap;word-wrap:break-word;
  }
  .quote-input::placeholder{color:var(--ink-faint);font-style:italic;}
  .quote-input[readonly]{cursor:default;}
  .quote-input[readonly]:focus{outline:none;}
  .quote-actions{display:flex;justify-content:flex-end;margin-top:8px;}
  .shuffle-btn{
    flex:none;background:none;border:1px solid var(--card-line);border-radius:var(--radius-pill);
    padding:6px 12px;font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;
  }
  .shuffle-btn:hover{background:var(--paper);}
  .shuffle-btn svg{width:13px;height:13px;}

  /* ---------- Grid ---------- */
  .grid{display:grid;grid-template-columns: 320px 1fr;gap:var(--stack-gap);align-items:start;}
  @media (max-width:880px){.grid{grid-template-columns:1fr;}}
  /* En pantallas angostas la grilla se apila en dos filas; el gap de la grilla ya separa
     una columna de otra, así que la última tarjeta de cada columna no debe sumar su propio
     margen o el espacio se duplicaría. */
  .col-left > .card:last-child,
  .col-right > .card:last-child{margin-bottom:0;}

  .card{
    background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius-card);
    padding:18px 18px 16px;box-shadow:var(--shadow-card);margin-bottom:var(--stack-gap);
  }
  .card h2{
    margin:0 0 14px;font-family:var(--font-display);font-weight:400;font-size:15px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);
    display:flex;align-items:center;gap:8px;
  }
  .card h2 svg{width:15px;height:15px;color:var(--clay);}
  .card h2 .count{
    margin-left:auto;font-family:var(--font-body);text-transform:none;letter-spacing:0;
    font-size:14px;font-weight:700;color:var(--ink-soft);
    background:var(--paper);border:1px solid var(--card-line);border-radius:var(--radius-pill);
    padding:3px 11px;
  }

  /* ---------- Habits ---------- */
  .habit-row{
    display:flex;align-items:center;gap:12px;padding:9px 0;
    border-bottom:1px solid var(--card-line);
  }
  .habit-row:last-child{border-bottom:none;}
  .habit-icon{
    flex:none;width:30px;height:30px;border-radius:50%;background:var(--paper);
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  }
  .habit-icon svg{width:16px;height:16px;}
  .habit-text{flex:1;min-width:0;}
  .habit-text .label{font-size:13.5px;font-weight:600;}
  .habit-text .hint{font-size:11px;color:var(--ink-faint);}
  .habit-toggle{
    flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--card-line);
    background:transparent;display:flex;align-items:center;justify-content:center;color:transparent;
    transition:all .15s;
  }
  .habit-toggle svg{width:14px;height:14px;}
  .habit-toggle[data-done="true"]{background:var(--teal);border-color:var(--teal);color:#fff;}
  .habit-row[data-done="true"] .habit-icon{background:var(--teal-soft);color:var(--teal);}
  .habit-row[data-done="true"] .label{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--ink-faint);}

  /* ---------- Water ---------- */
  .water-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .drop-btn{
    width:34px;height:34px;border:none;background:none;color:var(--card-line);
    display:flex;align-items:center;justify-content:center;
  }
  .drop-btn svg{width:24px;height:24px;}
  .drop-btn[data-filled="true"]{color:var(--blue);}
  .water-caption{font-size:12.5px;color:var(--ink-soft);}
  .water-caption b{color:var(--ink);}

  /* ---------- Contadores (enojo / ansiedad) ---------- */
  .counter-row{display:flex;align-items:center;gap:16px;}
  .counter-display{display:flex;flex-direction:column;align-items:center;line-height:1;}
  .counter-big{font-family:var(--font-display);font-size:46px;font-weight:400;}
  .counter-caption{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px;}
  .counter-display.anger .counter-big{color:var(--clay);}
  .counter-display.anxiety .counter-big{color:var(--blue);}
  .counter-btn{
    flex:none;min-width:58px;padding:9px 0;border-radius:var(--radius-pill);
    border:1.5px solid var(--card-line);background:var(--paper);font-size:14px;font-weight:700;
    text-align:center;transition:transform .12s, background .12s;
  }
  .counter-btn:active{transform:scale(.94);}
  .counter-btn.anger{border-color:var(--clay);color:var(--clay);}
  .counter-btn.anger:hover{background:var(--clay-soft);}
  .counter-btn.anxiety{border-color:var(--blue);color:var(--blue);}
  .counter-btn.anxiety:hover{background:var(--blue-soft);}
  .counter-reset{
    background:none;border:none;color:var(--ink-faint);font-size:11.5px;cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;padding:2px 0;margin-left:auto;
  }
  .counter-reset:hover{color:var(--ink-soft);}
  .counter-reset svg{width:11px;height:11px;}
  .counter-msg{
    margin-top:12px;padding:10px 12px;background:var(--paper);border-left:3px solid var(--clay);
    border-radius:2px;font-family:var(--font-display);font-style:italic;font-size:13.5px;color:var(--ink-soft);
    line-height:1.4;
  }
  .counter-msg.anxiety{border-left-color:var(--blue);}

  /* ---------- Ruled lines (priorities / gratitude / notes) ---------- */
  .ruled-line{
    display:flex;align-items:baseline;gap:10px;
    border-bottom:1px solid var(--card-line);padding:9px 0;
  }
  .ruled-line .num{
    flex:none;font-family:var(--font-display);font-size:15px;color:var(--clay);width:16px;
  }
  .ruled-line input{
    flex:1;border:none;background:transparent;font-size:14.5px;min-width:0;padding:2px 0;
  }
  .ruled-line input::placeholder{color:var(--ink-faint);}

  /* ---------- Lists (goals/tasks) ---------- */
  .list-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--card-line);}
  .list-row:last-child{border-bottom:none;}
  .check-box{
    flex:none;width:19px;height:19px;border:1.5px solid var(--ink-faint);border-radius:4px;
    background:transparent;display:flex;align-items:center;justify-content:center;color:transparent;
  }
  .check-box svg{width:12px;height:12px;}
  .check-box[data-done="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .list-row input[type=text]{
    flex:1;border:none;background:transparent;font-size:14px;min-width:0;padding:3px 0;
  }
  .list-row[data-done="true"] input[type=text]{color:var(--ink-faint);text-decoration:line-through;}
  .carried-tag{
    flex:none;font-size:10px;font-style:italic;color:var(--ink-faint);
    white-space:nowrap;margin-right:2px;
  }
  .carried-tag.warn{color:var(--clay);font-weight:600;font-style:normal;}
  .move-select{
    flex:none;font-size:10.5px;color:var(--ink-soft);background:var(--paper);
    border:1px solid var(--card-line);border-radius:var(--radius-pill);
    padding:3px 5px;max-width:84px;cursor:pointer;
  }
  .move-select:hover{border-color:var(--ink-faint);}
  .row-del{
    flex:none;background:none;border:none;color:var(--ink-faint);opacity:0;
    width:22px;height:22px;display:flex;align-items:center;justify-content:center;
    transition:opacity .12s;
  }
  .list-row:hover .row-del{opacity:1;}
  .row-del svg{width:14px;height:14px;}
  .row-del:hover{color:var(--clay);}
  .add-row{
    display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:4px;
  }
  .add-row input{flex:1;border:none;border-bottom:1px dashed var(--card-line);background:transparent;
    font-size:14px;padding:5px 0;min-width:0;}
  .add-row input::placeholder{color:var(--ink-faint);}
  .add-btn{
    flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--ink-faint);
    background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  }
  .add-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .add-btn svg{width:13px;height:13px;}
  .empty-hint{font-size:12.5px;color:var(--ink-faint);font-style:italic;padding:4px 0;}

  /* ---------- Notes ---------- */
  .notes-area{position:relative;}
  .notes-area::before{
    content:"";position:absolute;left:32px;top:0;bottom:0;width:1px;background:var(--clay-soft);
  }
  textarea.notes-input{
    width:100%;min-height:170px;resize:vertical;border:none;background:
      repeating-linear-gradient(var(--card), var(--card) 27px, var(--card-line) 28px);
    background-position:0 2px;
    font-size:14.5px;line-height:28px;padding:2px 12px 2px 46px;color:var(--ink);
  }

  footer.foot{
    text-align:center;font-size:11.5px;color:var(--ink-faint);margin-top:8px;
  }

  input[type=file]{display:none;}

  /* ---------- Configuración (modal) ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(43,38,33,0.42);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal-card{
    background:var(--paper);border:1px solid var(--card-line);border-radius:var(--radius-card);
    width:100%;max-width:480px;max-height:85vh;overflow-y:auto;
    box-shadow:0 20px 40px -12px rgba(43,38,33,0.5);
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;border-bottom:2px solid var(--ink);position:sticky;top:0;background:var(--paper);
  }
  .modal-head h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:19px;}
  .modal-close{
    background:none;border:1px solid var(--card-line);border-radius:50%;
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  }
  .modal-close svg{width:13px;height:13px;}
  .modal-close:hover{background:var(--card);}
  .modal-section{padding:18px 20px;border-bottom:1px solid var(--card-line);}
  .modal-section:last-child{border-bottom:none;}
  .modal-section h4{
    margin:0 0 4px;font-family:var(--font-display);font-weight:400;font-size:14px;
    letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);
    display:flex;align-items:center;gap:7px;
  }
  .modal-section h4 svg{width:13px;height:13px;flex:none;color:var(--clay);}
  .modal-hint{font-size:12px;color:var(--ink-faint);margin:0 0 12px;}
  .modal-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .modal-actions .icon-btn{padding:9px 14px;font-size:13px;}
  .quote-list-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--card-line);}
  .quote-list-row:last-of-type{border-bottom:none;}
  .habit-edit-row{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--card-line);}
  .habit-edit-row:last-of-type{border-bottom:none;}
  .habit-edit-fields{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
  .habit-edit-fields input{
    border:none;background:transparent;font-family:var(--font-body);padding:2px 0;min-width:0;
  }
  .habit-edit-fields input:first-child{font-size:13.5px;font-weight:600;color:var(--ink);}
  .habit-edit-fields input:last-child{font-size:12px;color:var(--ink-soft);}
  .water-goal-field{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .water-goal-field input[type=number]{
    width:64px;text-align:center;border:1px solid var(--card-line);border-radius:var(--radius-pill);
    padding:6px 8px;font-size:14px;background:var(--paper);color:var(--ink);
  }
  .quote-list-row textarea{
    flex:1;border:none;background:transparent;font-size:13.5px;line-height:1.4;
    min-width:0;resize:none;padding:2px 0;font-family:var(--font-body);
  }

  /* ---------- Calendario ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-month-label{font-family:var(--font-display);font-size:15px;text-transform:capitalize;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-weekday{
    font-size:10px;text-align:center;color:var(--ink-faint);letter-spacing:.05em;
    text-transform:uppercase;padding-bottom:6px;
  }
  .cal-day{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:50%;border:1px solid transparent;background:none;font-size:13px;color:var(--ink);
    position:relative;min-width:0;
  }
  .cal-day:hover{background:var(--paper);}
  .cal-day.cal-today{border-color:var(--ink-faint);}
  .cal-day.cal-selected{background:var(--ink);color:var(--card);}
  .cal-day.cal-pending::after{
    content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
    width:5px;height:5px;border-radius:50%;background:var(--clay);
  }
  .cal-day.cal-selected.cal-pending::after{background:var(--clay-soft);}
  .cal-day.cal-empty{visibility:hidden;pointer-events:none;}
  .cal-legend-dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--clay);margin-right:5px;
  }

  /* ---------- Estadísticas ---------- */
  .stats-period-toggle{display:flex;gap:8px;}
  .period-btn{
    padding:7px 14px;border-radius:var(--radius-pill);border:1px solid var(--card-line);
    background:var(--paper);font-size:12.5px;color:var(--ink-soft);
  }
  .period-btn[data-active="true"]{background:var(--ink);color:var(--card);border-color:var(--ink);}
  .chart-legend{display:flex;gap:18px;margin-top:10px;font-size:12px;color:var(--ink-soft);}
  .chart-legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}
  .chart-legend .dot.anger{background:var(--clay);}
  .chart-legend .dot.anxiety{background:var(--blue);}
  .streak-badge{
    flex:none;font-size:11.5px;font-weight:700;color:var(--teal);background:var(--teal-soft);
    border-radius:var(--radius-pill);padding:4px 10px;white-space:nowrap;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

/* ============================= Estado ============================= */
let cfg = null;

let saveTimer = null;

let calendarOpen = false;

function todayStr(d){
  const dt = d ? new Date(d) : new Date();
  const y = dt.getFullYear(), m = String(dt.getMonth()+1).padStart(2,'0'), day = String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function defaultEntry(dateStr){
  const quotePool = (cfg && cfg.quotes && cfg.quotes.length) ? cfg.quotes : DEFAULT_QUOTES;
  const gratPool = (cfg && cfg.gratitudePhrases && cfg.gratitudePhrases.length) ? cfg.gratitudePhrases : DEFAULT_GRATITUDE;
  return {
    date: dateStr,
    weather: null,
    quote: pickDaily(dateStr, 'quote', quotePool),
    gratitudeText: pickDaily(dateStr, 'gratitude', gratPool),
    priorities: [],
    goals: [],
    tasks: [],
    notes: '',
    water: 0,
    anger: { count: 0, lastMessage: '' },
    anxiety: { count: 0, lastMessage: '' },
    habits: Object.fromEntries(
      ((cfg && Array.isArray(cfg.habits)) ? cfg.habits : HABIT_DEFAULTS).map(h => [h.key, false])
    )
  };
}

function loadState(){
  try{
    cfg = JSON.parse(localStorage.getItem(STORAGE_CFG)) || {};
  }catch(e){ cfg = {}; }
  try{
    hist = JSON.parse(localStorage.getItem(STORAGE_HIST)) || {};
  }catch(e){ hist = {}; }
  if(typeof cfg.waterGoal !== 'number') cfg.waterGoal = 8;
  if(!Array.isArray(cfg.quotes)) cfg.quotes = INITIAL_USER_QUOTES.slice();
  if(!Array.isArray(cfg.gratitudePhrases)) cfg.gratitudePhrases = INITIAL_USER_GRATITUDE.slice();
  if(!Array.isArray(cfg.angerPhrases)) cfg.angerPhrases = INITIAL_USER_ANGER_PHRASES.slice();
  if(!Array.isArray(cfg.anxietyPhrases)) cfg.anxietyPhrases = INITIAL_USER_ANXIETY_PHRASES.slice();
  if(!cfg.firstUseDate) cfg.firstUseDate = todayStr();
  if(!Array.isArray(cfg.habits)) cfg.habits = HABIT_DEFAULTS.map(h => ({...h}));
}

/* Días transcurridos desde el último respaldo exportado (o desde el primer uso si nunca se ha exportado) */
function daysSinceExport(){
  const today = todayStr();
  const base = cfg.lastExportDate || cfg.firstUseDate || today;
  const a = new Date(base + 'T00:00:00');
  const b = new Date(today + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

/* Elige una frase al azar, evitando repetir la anterior si hay más de una disponible */
function pickRandomDistinct(pool, current){
  if(!pool || !pool.length) return '';
  if(pool.length === 1) return pool[0];
  let next = current;
  while(next === current){ next = pool[Math.floor(Math.random()*pool.length)]; }
  return next;
}

/* Elige una frase de forma distinta cada día, de manera predecible según la fecha */
function dateHash(dateStr, salt){
  const s = dateStr + '|' + salt;
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return h;
}
function pickDaily(dateStr, salt, pool){
  if(!pool || !pool.length) return '';
  return pool[dateHash(dateStr, salt) % pool.length];
}

function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    localStorage.setItem(STORAGE_CFG, JSON.stringify(cfg));
    localStorage.setItem(STORAGE_HIST, JSON.stringify(hist));
  }, 250);
}

function getEntry(dateStr){
  if(!hist[dateStr]) hist[dateStr] = defaultEntry(dateStr);
  const e = hist[dateStr];
  if(!e.habits) e.habits = {};
  ((cfg && Array.isArray(cfg.habits)) ? cfg.habits : HABIT_DEFAULTS).forEach(h=>{
    if(!(h.key in e.habits)) e.habits[h.key] = false;
  });
  if(!Array.isArray(e.priorities)){
    e.priorities = [];
  } else if(e.priorities.length && typeof e.priorities[0] === 'string'){
    /* formato antiguo: 3 líneas de texto fijas -> lista dinámica de {text, done} */
    e.priorities = e.priorities.filter(t => t && t.trim()).map(t => ({text:t, done:false}));
  }
  if(typeof e.gratitudeText !== 'string'){
    const gratPool = (cfg && cfg.gratitudePhrases && cfg.gratitudePhrases.length) ? cfg.gratitudePhrases : DEFAULT_GRATITUDE;
    e.gratitudeText = pickDaily(dateStr, 'gratitude', gratPool);
  }
  if(!Array.isArray(e.goals)) e.goals = [];
  if(!Array.isArray(e.tasks)) e.tasks = [];
  if(typeof e.water !== 'number') e.water = 0;
  if(typeof e.notes !== 'string') e.notes = '';
  if(!e.anger) e.anger = { count: 0, lastMessage: '' };
  if(!e.anxiety) e.anxiety = { count: 0, lastMessage: '' };
  return e;
}

/* ============================= Traslado automático de pendientes ============================= */
/* Mueve prioridades, metas y tareas sin marcar, y notas sin vaciar, de "source" hacia "target".
   Lo ya resuelto (hecho) se queda en su día original; solo viaja lo pendiente. */
function migratePendingForward(source, target){
  ['priorities','goals','tasks'].forEach(key=>{
    const pending = source[key].filter(it => !it.done).map(it => ({
      text: it.text, done:false, carried:true,
      carriedDays: (it.carriedDays || 0) + 1
    }));
    const doneHere = source[key].filter(it => it.done);
    source[key] = doneHere;
    target[key] = pending.concat(target[key] || []);
  });
  if(source.notes && source.notes.trim()){
    const carriedNotes = source.notes.trim();
    target.notes = target.notes ? (carriedNotes + '\n\n' + target.notes) : carriedNotes;
    source.notes = '';
  }
  source.migratedOut = true;
}

/* Se ejecuta una vez por cada día real distinto en que se abre la app: busca el último día
   con pendientes sin trasladar y los mueve hacia el día de hoy. */
function runDailyRollover(){
  const today = todayStr();
  if(cfg.lastRolloverDate === today) return;
  const priorDates = Object.keys(hist).filter(d => d < today && !hist[d].migratedOut).sort();
  if(priorDates.length){
    const sourceDate = priorDates[priorDates.length - 1];
    const source = getEntry(sourceDate);
    const target = getEntry(today);
    migratePendingForward(source, target);
  }
  cfg.lastRolloverDate = today;
  scheduleSave();
}

/* ============================= Calendario ============================= */
/* Revisa (sin crear entradas nuevas) si a esa fecha le quedaron prioridades, metas o tareas sin marcar */
function hasPendingOnDate(dateStr){
  const e = hist[dateStr];
  if(!e) return false;
  const pend = arr => Array.isArray(arr) && arr.some(it => !it.done);
  return pend(e.priorities) || pend(e.goals) || pend(e.tasks);
}

const WEEKDAY_LABELS = ['L','M','X','J','V','S','D'];

function buildCalendarCells(year, month){
  const firstJsDay = new Date(year, month, 1).getDay(); // 0=domingo..6=sábado
  const offset = (firstJsDay + 6) % 7; // convertir para que la semana inicie en lunes
  const totalDays = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<offset;i++) cells.push(null);
  for(let d=1; d<=totalDays; d++){
    const y = year, m = String(month+1).padStart(2,'0'), day = String(d).padStart(2,'0');
    cells.push(`${y}-${m}-${day}`);
  }
  return cells;
}

/* ============================= Estadísticas ============================= */
/* Días consecutivos (terminando hoy) en que un hábito estuvo marcado */
function habitStreak(key){
  let count = 0;
  let d = new Date(todayStr() + 'T00:00:00');
  while(true){
    const ds = todayStr(d);
    const e = hist[ds];
    if(e && e.habits && e.habits[key]){ count++; d.setDate(d.getDate()-1); }
    else break;
  }
  return count;
}

/* Últimos `n` días (incluyendo hoy), del más antiguo al más reciente */
function lastNDates(n){
  const out = [];
  const base = new Date(todayStr() + 'T00:00:00');
  for(let i = n-1; i>=0; i--){
    const d = new Date(base);
    d.setDate(d.getDate()-i);
    out.push(todayStr(d));
  }
  return out;
}

/* Gráfico de barras agrupadas (enojo/ansiedad) construido a mano en SVG */
function buildMoodChartSVG(days, angerVals, anxietyVals){
  const n = days.length;
  const groupW = n <= 7 ? 42 : (n <= 14 ? 26 : 13);
  const barW = groupW * 0.34;
  const gap = groupW * 0.1;
  const chartH = 86;
  const w = n * groupW + 16;
  const maxVal = Math.max(1, ...angerVals, ...anxietyVals);
  const baseline = chartH + 14;
  let bars = '', labels = '';

  days.forEach((d,i)=>{
    const x = 8 + i*groupW;
    const aH = (angerVals[i]/maxVal)*chartH;
    const nH = (anxietyVals[i]/maxVal)*chartH;
    bars += `<rect x="${x}" y="${baseline-aH}" width="${barW}" height="${Math.max(aH,angerVals[i]>0?2:0)}" rx="1.5" fill="#9C5340"></rect>`;
    bars += `<rect x="${x+barW+gap}" y="${baseline-nH}" width="${barW}" height="${Math.max(nH,anxietyVals[i]>0?2:0)}" rx="1.5" fill="#46647C"></rect>`;
    const showLabel = n <= 7 || i % Math.ceil(n/8) === 0;
    if(showLabel){
      const dt = new Date(d + 'T00:00:00');
      const lbl = n <= 7
        ? dt.toLocaleDateString('es-ES',{weekday:'short'}).charAt(0).toUpperCase()
        : String(dt.getDate());
      labels += `<text x="${x + barW + gap/2}" y="${baseline+12}" font-size="9" fill="#9A8E78" text-anchor="middle">${lbl}</text>`;
    }
  });

  return `<svg viewBox="0 0 ${w} ${chartH+26}" style="width:100%;height:auto;display:block;">${bars}${labels}</svg>`;
}

/* ============================= Utilidades de fecha ============================= */
function shiftDate(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return todayStr(d);
}

function longDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const dow = d.toLocaleDateString('es-ES', {weekday:'long'});
  const day = d.getDate();
  const month = d.toLocaleDateString('es-ES', {month:'long'});
  const year = d.getFullYear();
  return {dow, day, month, year};
}

/* Calcula el % de progreso del día a partir de una entrada. Se usa tanto en el render completo
   como en la actualización rápida (sin redibujar todo) cuando se escribe en Notas. */
function computeProgress(entry){
  const totalHabits = cfg.habits.length;
  const doneHabits = cfg.habits.filter(h => entry.habits[h.key]).length;
  const totalTasks = entry.tasks.length;
  const doneTasks = entry.tasks.filter(t=>t.done).length;
  const totalGoals = entry.goals.length;
  const doneGoals = entry.goals.filter(g=>g.done).length;
  const totalPriorities = entry.priorities.length;
  const donePriorities = entry.priorities.filter(p=>p.done).length;
  const waterDone = entry.water >= cfg.waterGoal ? 1 : 0;
  // Las notas solo entran a la cuenta cuando hay algo escrito por repartir a su lugar correspondiente;
  // si el campo está vacío (no has escrito nada, o ya lo vaciaste), no suma ni resta.
  const notesPending = entry.notes.trim() ? 1 : 0;

  const totalUnits = totalHabits + 1 /* agua */ + notesPending + totalTasks + totalGoals + totalPriorities;
  const doneUnits = doneHabits + waterDone + doneTasks + doneGoals + donePriorities;
  const pct = totalUnits ? Math.round((doneUnits/totalUnits)*100) : 0;
  return {totalHabits, doneHabits, totalTasks, doneTasks, totalGoals, doneGoals, totalPriorities, donePriorities, pct};
}

/* Actualiza solo el número de progreso en pantalla, sin redibujar todo (para no perder el cursor
   mientras se escribe en Notas). */
function updateProgressBadge(){
  const entry = getEntry(currentDate);
  const {pct} = computeProgress(entry);
  const el = document.querySelector('.progress-note b');
  if(el) el.textContent = pct + '%';
}

          <span class="hint">${doneDays}/${period} días en el periodo</span>
        </span>
        <span class="streak-badge">${streak === 1 ? '1 día seguido' : streak + ' días seguidos'}</span>
      </div>`;
  }).join('');

  return `
    <div class="modal-overlay" id="statsOverlay">
      <div class="modal-card" style="max-width:560px;">
        <div class="modal-head">
          <h3>Tus patrones</h3>
          <button class="modal-close" data-action="close-stats" aria-label="Cerrar">${ICONS.close}</button>
        </div>

        <section class="modal-section">
          <div class="stats-period-toggle">
            <button class="period-btn" data-action="stats-period-7" data-active="${period===7}">Últimos 7 días</button>
            <button class="period-btn" data-action="stats-period-30" data-active="${period===30}">Últimos 30 días</button>
          </div>
        </section>

        <section class="modal-section">
          <h4>${ICONS.chart} Enojo y ansiedad por día</h4>
          <p class="modal-hint">Total del periodo: ${angerTotal} de enojo, ${anxietyTotal} de ansiedad. Fíjate si hay días o rachas que se repiten.</p>
          ${buildMoodChartSVG(days, angerVals, anxietyVals)}
          <div class="chart-legend">
            <span><span class="dot anger"></span>Enojo</span>
            <span><span class="dot anxiety"></span>Ansiedad</span>
          </div>
        </section>

        <section class="modal-section">
          <h4>${ICONS.check} Racha y consistencia de hábitos</h4>
          ${habitRows}
        </section>

        <section class="modal-section">
          <h4>${ICONS.drop} Agua</h4>
          <p class="modal-hint" style="margin:0;">Promedio de los últimos ${period} días: <b style="color:var(--ink);">${waterAvg}</b> de ${cfg.waterGoal} vasos por día.</p>
        </section>
      </div>
    </div>`;
}

function renderCalendarModal(){
  if(calendarYear === null){
    const d = new Date(currentDate + 'T00:00:00');
    calendarYear = d.getFullYear();
    calendarMonth = d.getMonth();
  }
  const monthLabel = new Date(calendarYear, calendarMonth, 1).toLocaleDateString('es-ES', {month:'long', year:'numeric'});
  const cells = buildCalendarCells(calendarYear, calendarMonth);
  const today = todayStr();

  return `
    <div class="modal-overlay" id="calendarOverlay">
      <div class="modal-card" style="max-width:340px;">
        <div class="modal-head">
          <h3>Elegir fecha</h3>
          <button class="modal-close" data-action="close-calendar" aria-label="Cerrar">${ICONS.close}</button>
        </div>
        <section class="modal-section">
          <div class="cal-head">
            <button class="nav-arrow" data-action="cal-prev-month" aria-label="Mes anterior">${ICONS.chevL}</button>
            <span class="cal-month-label">${monthLabel}</span>
            <button class="nav-arrow" data-action="cal-next-month" aria-label="Mes siguiente">${ICONS.chevR}</button>
          </div>
          <div class="cal-grid">
            ${WEEKDAY_LABELS.map(w => `<span class="cal-weekday">${w}</span>`).join('')}
            ${cells.map(dateStr=>{
              if(!dateStr) return `<span class="cal-day cal-empty"></span>`;
              const classes = ['cal-day'];
              if(dateStr === currentDate) classes.push('cal-selected');
              if(dateStr === today) classes.push('cal-today');
              if(hasPendingOnDate(dateStr)) classes.push('cal-pending');
              const day = parseInt(dateStr.slice(-2),10);
              return `<button class="${classes.join(' ')}" data-action="pick-date" data-date="${dateStr}">${day}</button>`;
            }).join('')}
          </div>
          <p class="modal-hint" style="margin-top:12px;"><span class="cal-legend-dot"></span> quedaron pendientes ese día</p>
        </section>
      </div>
    </div>`;
}

function renderBackupBanner(){
  const today = todayStr();
  if(cfg.backupBannerDismissedOn === today) return '';
  const days = daysSinceExport();
  if(days < EXPORT_REMINDER_DAYS) return '';

  const msg = cfg.lastExportDate
    ? `Han pasado ${days} días desde tu último respaldo.`
    : `Llevas ${days} días usando tu cuaderno y todavía no has exportado un respaldo.`;

  return `
    <div class="backup-banner">
      <span class="backup-icon">${ICONS.alert}</span>
      <span class="msg">${msg} Expórtalo para no perder tu historial si algo le pasa a este navegador.</span>
      <button class="export-now" data-action="export-now-banner">${ICONS.download} Exportar ahora</button>
      <button class="dismiss" data-action="dismiss-banner" aria-label="Cerrar aviso">${ICONS.close}</button>
    </div>`;
}

/* Prioridades, Metas y Tareas comparten la misma forma de lista; estos mapeos permiten
   mover un item de una a otra conservando su estado (hecho / días arrastrado). */
const KIND_TO_LISTKEY = {priority:'priorities', goal:'goals', task:'tasks'};
const KIND_LABELS = {priority:'Prioridad', goal:'Meta', task:'Tarea'};

function renderChecklist(items, kind){
  if(!items.length) return `<div class="empty-hint">Todavía no hay nada aquí.</div>`;
  const otherKinds = Object.keys(KIND_TO_LISTKEY).filter(k => k !== kind);
  return items.map((it,i)=>`
    <div class="list-row" data-done="${!!it.done}">
      <button class="check-box" data-action="toggle-${kind}" data-index="${i}" data-done="${!!it.done}" aria-label="Marcar como hecho">${ICONS.check}</button>
      <input type="text" data-field="${kind}Text" data-index="${i}" value="${escAttr(it.text)}">
      ${it.carried ? `<span class="carried-tag${it.carriedDays >= 3 ? ' warn' : ''}">hace ${it.carriedDays} día${it.carriedDays > 1 ? 's' : ''}</span>` : ''}
      <select class="move-select" data-move-kind="${kind}" data-index="${i}" aria-label="Mover a otra lista">
        <option value="">Mover…</option>
        ${otherKinds.map(k => `<option value="${k}">→ ${KIND_LABELS[k]}</option>`).join('')}
      </select>
      <button class="row-del" data-action="del-${kind}" data-index="${i}" aria-label="Eliminar">${ICONS.trash}</button>
    </div>
  `).join('');
}

function escAttr(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function escHtml(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
}

/* ============================= Eventos ============================= */
const app = document.getElementById('app');

app.addEventListener('input', (e)=>{
  const el = e.target;
  const entry = getEntry(currentDate);
  const field = el.dataset.field;
  if(!field) return;
  const idx = el.dataset.index !== undefined ? parseInt(el.dataset.index,10) : null;

  if(field === 'quote'){ entry.quote = el.value; autoGrow(el); }
  else if(field === 'priorityText'){ entry.priorities[idx].text = el.value; }
  else if(field === 'gratitudeText'){ entry.gratitudeText = el.value; autoGrow(el); }
  else if(field === 'notes'){ entry.notes = el.value; updateProgressBadge(); }
  else if(field === 'goalText'){ entry.goals[idx].text = el.value; }
  else if(field === 'taskText'){ entry.tasks[idx].text = el.value; }
  else if(field === 'quoteText'){ cfg.quotes[idx] = el.value; autoGrow(el); }
  else if(field === 'gratitudePhraseText'){ cfg.gratitudePhrases[idx] = el.value; autoGrow(el); }
  else if(field === 'angerPhraseText'){ cfg.angerPhrases[idx] = el.value; autoGrow(el); }
  else if(field === 'anxietyPhraseText'){ cfg.anxietyPhrases[idx] = el.value; autoGrow(el); }
  else if(field === 'habitLabel'){ cfg.habits[idx].label = el.value; }
  else if(field === 'habitHint'){ cfg.habits[idx].hint = el.value; }
  else if(field === 'waterGoal'){
    const v = parseInt(el.value, 10);
    if(!isNaN(v) && v >= 1 && v <= 20){ cfg.waterGoal = v; }
  }
  scheduleSave();
});

app.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && e.target.dataset.add){
    e.preventDefault();
    const kind = e.target.dataset.add;
    if(kind === 'goal') addItem('goals', e.target);
    if(kind === 'task') addItem('tasks', e.target);
    if(kind === 'priority') addItem('priorities', e.target);
    if(kind === 'quote') addQuote(e.target);
    if(kind === 'gratitude-phrase') addGratitudePhrase(e.target);
    if(kind === 'anger-phrase') addBankPhrase('angerPhrases', e.target);
    if(kind === 'anxiety-phrase') addBankPhrase('anxietyPhrases', e.target);
    if(kind === 'habit') addHabit(e.target);
  }
});

app.addEventListener('change', (e)=>{
  const sel = e.target.closest('select.move-select');
  if(!sel) return;
  const targetKind = sel.value;
  if(!targetKind) return;
  moveItem(sel.dataset.moveKind, targetKind, parseInt(sel.dataset.index,10));
});

app.addEventListener('click', (e)=>{
  if(e.target.id === 'settingsOverlay'){ settingsOpen = false; render(); return; }
  if(e.target.id === 'calendarOverlay'){ calendarOpen = false; render(); return; }
  if(e.target.id === 'statsOverlay'){ statsOpen = false; render(); return; }
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const entry = getEntry(currentDate);

  switch(action){
    case 'prev-day': currentDate = shiftDate(currentDate, -1); render(); break;
    case 'next-day': currentDate = shiftDate(currentDate, 1); render(); break;
    case 'go-today': currentDate = todayStr(); render(); break;

    case 'weather': {
      const w = btn.dataset.w;
      entry.weather = (entry.weather === w) ? null : w;
      scheduleSave(); render();
      break;
    }

    case 'shuffle-quote': {
      const pool = (cfg.quotes && cfg.quotes.length) ? cfg.quotes : DEFAULT_QUOTES;
      let q = entry.quote;
      let next = q;
      if(pool.length === 1){ next = pool[0]; }
      else{ while(next === q){ next = pool[Math.floor(Math.random()*pool.length)]; } }
      entry.quote = next;
      scheduleSave(); render();
      break;
    }

    case 'shuffle-gratitude': {
      const pool = (cfg.gratitudePhrases && cfg.gratitudePhrases.length) ? cfg.gratitudePhrases : DEFAULT_GRATITUDE;
      let q = entry.gratitudeText;
      let next = q;
      if(pool.length === 1){ next = pool[0]; }
      else{ while(next === q){ next = pool[Math.floor(Math.random()*pool.length)]; } }
      entry.gratitudeText = next;
      scheduleSave(); render();
      break;
    }

    case 'open-calendar': {
      const d = new Date(currentDate + 'T00:00:00');
      calendarYear = d.getFullYear();
      calendarMonth = d.getMonth();
      calendarOpen = true;
      render();
      break;
    }
    case 'close-calendar': calendarOpen = false; render(); break;
    case 'cal-prev-month': {
      calendarMonth--;
      if(calendarMonth < 0){ calendarMonth = 11; calendarYear--; }
      render();
      break;
    }
    case 'cal-next-month': {
      calendarMonth++;
      if(calendarMonth > 11){ calendarMonth = 0; calendarYear++; }
      render();
      break;
    }
    case 'pick-date': {
      currentDate = btn.dataset.date;
      calendarOpen = false;
      render();
      break;
    }

    case 'open-stats': statsOpen = true; render(); break;
    case 'close-stats': statsOpen = false; render(); break;
    case 'stats-period-7': statsPeriod = 7; render(); break;
    case 'stats-period-30': statsPeriod = 30; render(); break;

    case 'add-habit': addHabit(document.getElementById('new-habit')); break;
    case 'del-habit': {
      const i = parseInt(btn.dataset.index,10);
      const h = cfg.habits[i];
      const ok = window.confirm(`¿Eliminar el hábito "${h.label}"? Dejará de aparecer para registrar (tu historial pasado de este hábito no se borra, solo deja de mostrarse).`);
      if(ok){ cfg.habits.splice(i,1); scheduleSave(); render(); }
      break;
    }

    case 'open-settings': settingsOpen = true; render(); break;
    case 'close-settings': settingsOpen = false; render(); break;

    case 'add-quote': addQuote(document.getElementById('new-quote')); break;
    case 'del-quote': {
      const i = parseInt(btn.dataset.index,10);
      cfg.quotes.splice(i,1);
      scheduleSave(); render();
      break;
    }
    case 'add-gratitude-phrase': addGratitudePhrase(document.getElementById('new-gratitude-phrase')); break;
    case 'del-gratitude-phrase': {
      const i = parseInt(btn.dataset.index,10);
      cfg.gratitudePhrases.splice(i,1);
      scheduleSave(); render();
      break;
    }

    case 'toggle-habit': {
      const key = btn.dataset.key;
      entry.habits[key] = !entry.habits[key];
      scheduleSave(); render();
      break;
    }

    case 'water': {
      const i = parseInt(btn.dataset.index,10);
      entry.water = (entry.water === i+1) ? i : i+1;
      scheduleSave(); render();
      break;
    }

    case 'add-goal': addItem('goals', document.getElementById('new-goal')); break;
    case 'add-task': addItem('tasks', document.getElementById('new-task')); break;
    case 'add-priority': addItem('priorities', document.getElementById('new-priority')); break;

    case 'toggle-goal': toggleItem('goals', btn); break;
    case 'toggle-task': toggleItem('tasks', btn); break;
    case 'toggle-priority': toggleItem('priorities', btn); break;
    case 'del-goal': delItem('goals', btn); break;
    case 'del-task': delItem('tasks', btn); break;
    case 'del-priority': delItem('priorities', btn); break;

    case 'count-anger': {
      entry.anger.count += 1;
      const pool = (cfg.angerPhrases && cfg.angerPhrases.length) ? cfg.angerPhrases : DEFAULT_ANGER_PHRASES;
      entry.anger.lastMessage = pickRandomDistinct(pool, entry.anger.lastMessage);
      scheduleSave(); render();
      break;
    }
    case 'reset-anger': {
      entry.anger.count = 0; entry.anger.lastMessage = '';
      scheduleSave(); render();
      break;
    }
    case 'count-anxiety': {
      entry.anxiety.count += 1;
      const pool = (cfg.anxietyPhrases && cfg.anxietyPhrases.length) ? cfg.anxietyPhrases : DEFAULT_ANXIETY_PHRASES;
      entry.anxiety.lastMessage = pickRandomDistinct(pool, entry.anxiety.lastMessage);
      scheduleSave(); render();
      break;
    }
    case 'reset-anxiety': {
      entry.anxiety.count = 0; entry.anxiety.lastMessage = '';
      scheduleSave(); render();
      break;
    }

    case 'add-anger-phrase': addBankPhrase('angerPhrases', document.getElementById('new-anger-phrase')); break;
    case 'del-anger-phrase': {
      const i = parseInt(btn.dataset.index,10);
      cfg.angerPhrases.splice(i,1);
      scheduleSave(); render();
      break;
    }
    case 'add-anxiety-phrase': addBankPhrase('anxietyPhrases', document.getElementById('new-anxiety-phrase')); break;
    case 'del-anxiety-phrase': {
      const i = parseInt(btn.dataset.index,10);
      cfg.anxietyPhrases.splice(i,1);
      scheduleSave(); render();
      break;
    }

    case 'export': exportData(); render(); break;
    case 'export-now-banner': exportData(); render(); break;
    case 'dismiss-banner': {
      cfg.backupBannerDismissedOn = todayStr();
      scheduleSave(); render();
      break;
    }
    case 'import': document.getElementById('importInput').click(); break;
  }
});

function addItem(listKey, inputEl){
  const val = (inputEl.value || '').trim();
  if(!val) return;
  const entry = getEntry(currentDate);
  entry[listKey].push({text: val, done:false});
  inputEl.value = '';
  scheduleSave(); render();
}
function addQuote(inputEl){
  const val = (inputEl.value || '').trim();
  if(!val) return;
  cfg.quotes.push(val);
  inputEl.value = '';
  scheduleSave(); render();
}
function addHabit(inputEl){
  const val = (inputEl.value || '').trim();
  if(!val) return;
  const key = 'custom_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  cfg.habits.push({key, label: val, hint: ''});
  inputEl.value = '';
  scheduleSave(); render();
}
function addBankPhrase(bankKey, inputEl){
  const val = (inputEl.value || '').trim();
  if(!val) return;
  cfg[bankKey].push(val);
  inputEl.value = '';
  scheduleSave(); render();
}
function addGratitudePhrase(inputEl){
  const val = (inputEl.value || '').trim();
  if(!val) return;
  cfg.gratitudePhrases.push(val);
  inputEl.value = '';
  scheduleSave(); render();
}
function moveItem(sourceKind, targetKind, idx){
  const entry = getEntry(currentDate);
  const sourceListKey = KIND_TO_LISTKEY[sourceKind];
  const targetListKey = KIND_TO_LISTKEY[targetKind];
  if(!sourceListKey || !targetListKey || isNaN(idx)) return;
  const [item] = entry[sourceListKey].splice(idx, 1);
  if(item) entry[targetListKey].push(item);
  scheduleSave(); render();
}
function toggleItem(listKey, btn){
  const i = parseInt(btn.dataset.index,10);
  const entry = getEntry(currentDate);
  entry[listKey][i].done = !entry[listKey][i].done;
  scheduleSave(); render();
}
function delItem(listKey, btn){
  const i = parseInt(btn.dataset.index,10);
  const entry = getEntry(currentDate);
  const item = entry[listKey][i];
  if(item && item.carriedDays > 0){
    const label = item.carriedDays === 1 ? '1 día' : `${item.carriedDays} días`;
    const ok = window.confirm(`Esto lleva ${label} pendiente. ¿Seguro que quieres eliminarlo? No se puede deshacer.`);
    if(!ok) return;
  }
  entry[listKey].splice(i,1);
  scheduleSave(); render();
}

/* ============================= Exportar / Importar ============================= */
function exportData(){
  const payload = { cfg, hist, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `planeador-diario-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  cfg.lastExportDate = todayStr();
  scheduleSave();
}

document.getElementById('importInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(data.cfg) cfg = data.cfg;
      if(data.hist) hist = data.hist;
      if(typeof cfg.waterGoal !== 'number') cfg.waterGoal = 8;
      if(!Array.isArray(cfg.quotes)) cfg.quotes = INITIAL_USER_QUOTES.slice();
      if(!Array.isArray(cfg.gratitudePhrases)) cfg.gratitudePhrases = INITIAL_USER_GRATITUDE.slice();
      if(!Array.isArray(cfg.angerPhrases)) cfg.angerPhrases = INITIAL_USER_ANGER_PHRASES.slice();
      if(!Array.isArray(cfg.anxietyPhrases)) cfg.anxietyPhrases = INITIAL_USER_ANXIETY_PHRASES.slice();
      if(!Array.isArray(cfg.habits)) cfg.habits = HABIT_DEFAULTS.map(h => ({...h}));
      scheduleSave();
      render();
      alert('Cuaderno importado correctamente.');
    }catch(err){
      alert('No se pudo leer el archivo. Verifica que sea un respaldo válido (.json).');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ============================= Inicio ============================= */
loadState();
runDailyRollover();
render();
</script>
